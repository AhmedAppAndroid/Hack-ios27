
name: Build iOS 27 Liquid Glass APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Exact Project ZIP
        shell: bash
        run: |
          set -e

          ZIP="$GITHUB_WORKSPACE/IOS27-Liquid-Glass-Fixed-Project.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::ZIP file not found: IOS27-Liquid-Glass-Fixed-Project.zip"
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ios27-project"

          unzip -oq "$ZIP" -d "$RUNNER_TEMP/ios27-project"

          test -f "$RUNNER_TEMP/ios27-project/settings.gradle"
          test -f "$RUNNER_TEMP/ios27-project/app/build.gradle"

          echo "PROJECT_DIR=$RUNNER_TEMP/ios27-project" >> "$GITHUB_ENV"

      - name: Check Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Build iOS 27 APK
        run: |
          gradle -p "$PROJECT_DIR" \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK successfully generated"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IOS27-Liquid-Glass-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
