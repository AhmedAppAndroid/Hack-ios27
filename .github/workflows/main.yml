
name: Build iOS 27 Liquid Glass Boot Fix APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Fixed Project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/IOS27-Liquid-Glass-Boot-Fixed-Project.zip"

          if [ -f "$GITHUB_WORKSPACE/settings.gradle" ]; then
            PROJECT="$GITHUB_WORKSPACE"
          else
            if [ ! -f "$ZIP" ]; then
              echo "::error::Project ZIP not found"
              exit 1
            fi

            PROJECT="$RUNNER_TEMP/ios27"
            mkdir -p "$PROJECT"
            unzip -oq "$ZIP" -d "$PROJECT"
          fi

          test -f "$PROJECT/settings.gradle"
          test -f "$PROJECT/app/build.gradle"

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IOS27-Liquid-Glass-Boot-Fixed-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
