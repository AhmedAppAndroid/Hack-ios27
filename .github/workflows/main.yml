
name: Build iOS 27 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Find Android Project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"

          SETTINGS=$(find "$ROOT" -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "Searching ZIP files..."

            mkdir -p "$RUNNER_TEMP/ios27"

            while IFS= read -r -d '' ZIP; do
              unzip -oq "$ZIP" \
                -d "$RUNNER_TEMP/ios27"

              SETTINGS=$(find "$RUNNER_TEMP/ios27" \
                -type f \
                \( -name settings.gradle \
                -o -name settings.gradle.kts \) \
                -print -quit)

              if [ -n "$SETTINGS" ]; then
                break
              fi
            done < <(find "$ROOT" \
              -type f -iname '*.zip' -print0)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "::error::Android project not found. Upload the complete iOS27 project ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" \
            >> "$GITHUB_ENV"

          echo "Found project: $PROJECT_DIR"

      - name: Check Android SDK
        run: |
          echo "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Build APK
        shell: bash
        run: |
          gradle -p "$PROJECT_DIR" \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IOS27-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
